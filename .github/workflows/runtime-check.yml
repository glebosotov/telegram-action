name: Runtime check
on:
  pull_request:
    branches: [runtime]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: sh -n entrypoint.sh
      - name: Build tested Go runtime without publishing
        run: docker build -t telegram-action:review .
      - name: Verify sender modes without sending messages
        run: |
          docker run --rm --entrypoint /bin/drone-telegram telegram-action:review --help | grep rich.message.file
          docker run --rm --entrypoint /bin/drone-telegram telegram-action:review --help | grep widget.file
