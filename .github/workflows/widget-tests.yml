name: Widget tests
on:
  pull_request:
    branches: [runtime]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: sh -n entrypoint.sh
      - name: Build runtime without publishing
        run: docker build -t telegram-action:widget-test .
      - name: Check both senders in the image
        run: |
          docker run --rm --entrypoint /bin/drone-telegram telegram-action:widget-test --help | grep rich.message.file
          docker run --rm --entrypoint python3 -v "$PWD:/tests:ro" -w /tests telegram-action:widget-test -m unittest discover -s tests -p 'test_*.py'
