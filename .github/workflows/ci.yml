name: Runtime image
on:
  push:
    branches: [runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker build -t telegram-action:test .
      - run: docker run --rm --entrypoint /bin/drone-telegram telegram-action:test --help | grep rich.message.file
